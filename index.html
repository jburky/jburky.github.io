<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Gravity Wells</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud" aria-hidden="true">
      <div>Level <b id="lvl">1</b></div>
      <div>Best <b id="best">0</b></div>
    </div>
    <div class="stats" aria-hidden="true">
      <div>Attempts <b id="attempts">0</b></div>
      <div>Crashes <b id="crashes">0</b></div>
      <div>Streak <b id="streak">0</b></div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="restart" title="Restart run" aria-label="Restart game run">
        ↺
      </button>
      <button class="icon-btn" id="mute" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button
        class="icon-btn hint-btn hidden"
        id="hint"
        title="Hint"
        aria-label="Show hint"
      >?</button>
      <button class="icon-btn" id="reload" title="Reload page" aria-label="Reload page">⟳</button>
    </div>
    <div id="version" class="version" aria-hidden="true">…</div>
    <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="panel" class="panel">
      <div class="card">
        <h1>GRAVITY WELLS</h1>
        <p>
          Drag from the <b class="accent">ship</b> to aim, release to launch. Slingshot around
          planets to reach the <b class="goal">goal</b>. Avoid crashing.
        </p>
        <button id="start">Play</button>
        <div class="hint">
          Tap/click planets before launch to flip gravity. Keyboard: arrows/WASD + Space to launch,
          R to restart.
        </div>
        <label class="daily" for="daily-seed">
          Daily challenge
          <input id="daily-seed" type="checkbox" />
        </label>
      </div>
    </div>
    <script src="game.js" defer></script>
  </body>
</html>
